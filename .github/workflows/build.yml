name: Java Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile all Java files
        shell: bash
        run: |
          set -u
          fail=0
          total=0
          failed_dirs=""

          # Compile each folder that contains .java files on its own,
          # so same class names in different folders don't clash.
          while IFS= read -r dir; do
            total=$((total + 1))
            out="$(mktemp -d)"
            if javac -d "$out" -sourcepath "$dir" "$dir"/*.java 2> err.txt; then
              echo "✅ $dir"
            else
              echo "::error title=Compile failed::$dir"
              echo "❌ $dir"
              cat err.txt
              fail=$((fail + 1))
              failed_dirs="$failed_dirs\n$dir"
            fi
            rm -rf "$out"
          done < <(find . -name '*.java' -not -path './.git/*' -printf '%h\n' | sort -u)

          echo ""
          echo "Compiled $total folders, $fail failed."
          if [ "$fail" -ne 0 ]; then
            echo "Failed folders:"
            printf "$failed_dirs\n"
            exit 1
          fi
